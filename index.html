<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>森声App</title>
    <script type="text/javascript">
      // 单页应用GitHub Pages路由重写解决方案
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // 设置正确的base URL
      window.baseUrl = window.location.pathname.includes('forest-sound-app') 
        ? '/forest-sound-app/' 
        : '/';
      
      // 添加音频文件路径修复功能
      window.getAudioPath = function(filename) {
        const base = window.baseUrl || '/';
        return `${base}assets/assets/sounds/${filename}`;
      };
      
      // 监听错误，提供更详细的日志
      window.addEventListener('error', function(e) {
        console.error('全局错误：', e.message, e.filename, e.lineno);
      });
    </script>
    <!-- 先加载补丁脚本，确保在主应用脚本之前执行 -->
    <script src="publicpath.js"></script>
    <script src="audioUnlock.js"></script>
    <script src="assetspatch.js"></script>
    <script src="_expo/static/js/web/entry-d4fce8fafc9c1607599c983a26712c27.js"></script>
  </body>
</html>
